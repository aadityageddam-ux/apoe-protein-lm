name: Verify

# Two independent checks, both offline:
#   - unit tests for the pipeline's pure functions
#   - re-derivation of every number in the README from the committed artifacts
# Neither needs an API token, so the published claims stay checkable by anyone.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Unit tests
        run: python -m pytest tests -v

      - name: Verify the committed results against the README
        run: python scripts/verify_results.py
